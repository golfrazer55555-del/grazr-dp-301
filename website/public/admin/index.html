<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>주문 관리 · GRAZR</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/admin.css?v=2">
</head>
<body>
<header class="bar">
  <a class="brand" href="/admin/"><img src="/assets/img/logo-stacked.png" alt="" width="35" height="28"><span>주문 관리</span></a>
  <button class="link" type="button" data-logout hidden>로그아웃</button>
</header>

<main class="wrap">
  <p class="notice" data-notice hidden></p>

  <form class="login" data-login hidden>
    <h1>로그인</h1>
    <label for="pw">관리자 비밀번호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">로그인</button>
    <p class="err" data-login-err></p>
  </form>

  <section data-app hidden>
    <nav class="tabs" data-tabs>
      <button type="button" data-tab="paid">발송 대기 <b data-count="paid">0</b></button>
      <button type="button" data-tab="shipped">발송 완료 <b data-count="shipped">0</b></button>
      <button type="button" data-tab="canceled">취소 <b data-count="canceled">0</b></button>
      <button type="button" data-tab="all">전체 <b data-count="all">0</b></button>
    </nav>
    <p class="hint">사이트(grazr.co.kr)에서 결제된 주문만 보입니다. 스마트스토어 주문은 스마트스토어센터에서 처리하세요.</p>
    <div class="list" data-list></div>
    <p class="empty" data-empty hidden>주문이 없습니다.</p>
  </section>
</main>

<template data-card>
  <details class="card">
    <summary>
      <span class="when" data-f="when"></span>
      <span class="pill" data-f="status"></span>
      <strong class="who" data-f="name"></strong>
      <span class="amt" data-f="amount"></span>
      <span class="what" data-f="what"></span>
    </summary>
    <div class="body">
      <dl class="kv">
        <div><dt>받는 분</dt><dd><span data-f="name2"></span> <button class="copy" type="button" data-copy="name">복사</button></dd></div>
        <div><dt>휴대폰</dt><dd><a data-f="phone"></a> <button class="copy" type="button" data-copy="phone">복사</button></dd></div>
        <div><dt>주소</dt><dd><span data-f="address"></span> <button class="copy" type="button" data-copy="address">복사</button></dd></div>
        <div><dt>배송 메모</dt><dd data-f="memo"></dd></div>
        <div><dt>이메일</dt><dd data-f="email"></dd></div>
        <div><dt>옵션</dt><dd data-f="option"></dd></div>
        <div><dt>결제</dt><dd><span data-f="pay"></span> <a data-f="receipt" target="_blank" rel="noopener">영수증</a></dd></div>
        <div><dt>주문번호</dt><dd class="mono" data-f="orderId"></dd></div>
      </dl>

      <form class="ship" data-ship>
        <h3>송장 입력</h3>
        <div class="row">
          <select name="courier" data-couriers></select>
          <input name="tracking" inputmode="numeric" autocomplete="off" placeholder="송장번호" required>
        </div>
        <button class="btn primary" type="submit">발송 처리</button>
      </form>

      <div class="shipped" data-shipped hidden>
        <h3>발송 완료</h3>
        <p><span data-f="courier"></span> <b class="mono" data-f="tracking"></b> · <span data-f="shippedAt"></span></p>
        <div class="row wrapbtn">
          <a class="btn primary" data-f="sms">문자로 발송 안내</a>
          <a class="btn" data-f="mail">메일로 발송 안내</a>
          <a class="btn" data-f="track" target="_blank" rel="noopener">배송 조회</a>
          <button class="btn" type="button" data-copy="message">안내 문구 복사</button>
        </div>
        <button class="link" type="button" data-unship>발송 처리 되돌리기</button>
      </div>

      <form class="note" data-note>
        <h3>메모</h3>
        <textarea name="note" rows="2" placeholder="예) 손님 요청으로 오후 발송"></textarea>
        <button class="btn small" type="submit">메모 저장</button>
      </form>

      <div class="danger">
        <button class="link" type="button" data-sync>토스페이먼츠 결제 상태 확인</button>
        <button class="link red" type="button" data-cancel>결제 취소 (전액 환불)</button>
      </div>
      <p class="err" data-err></p>
    </div>
  </details>
</template>

<script src="/assets/js/admin.js?v=2" defer></script>
</body>
</html>
